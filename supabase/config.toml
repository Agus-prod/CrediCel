project_id = "credicel"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth.email.template.confirmation]
subject = "Confirma tu cuenta de CrediCel"
